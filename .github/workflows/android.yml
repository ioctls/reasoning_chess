name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to update the "latest" release with the new APK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle -p android assembleDebug

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk chess-gym.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chess-gym-apk
          path: chess-gym.apk

      # Keep the "latest" tag pointing at the commit this APK was built from.
      - name: Move latest tag
        run: |
          git tag -f latest
          git push -f origin refs/tags/latest

      # A stable download link for your phone: Releases -> "latest" -> chess-gym.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: chess-gym.apk
